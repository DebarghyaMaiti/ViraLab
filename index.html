<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViraLab — Viral Transmission & Outbreak Simulation Platform</title>
    <meta name="description" content="Interactive viral transmission, multi-strain SEIRD dynamics, variant evolution, and outbreak simulation platform." />
    <meta property="og:title" content="ViraLab — Viral Transmission & Outbreak Simulation Platform" />
    <meta property="og:description" content="Interactive viral transmission, multi-strain SEIRD dynamics, variant evolution, and outbreak simulation platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Gracefully prevent benign Vite dev WebSocket / HMR notifications from bubbling as unhandled exceptions in the iframe
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('closed without opened'))) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || '')) + '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('[vite] failed to connect') || msg.includes('closed without opened'))) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('viralab_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
